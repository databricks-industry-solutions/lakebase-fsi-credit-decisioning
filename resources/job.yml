# Pipeline job — runs the five solution notebooks in sequence.
# Mirrors the manual RUNME.py / scripts/setup.sh flow, declared as a bundle resource.
resources:
  jobs:
    credit_pipeline:
      name: lakebase-credit-pipeline
      description: "End-to-end credit decisioning pipeline — lakebase-fsi-credit-decisioning SA"

      tasks:
        - task_key: 01_data_generation
          notebook_task:
            notebook_path: ../notebooks/01_data_generation.py
            base_parameters: &pipeline_params
              lakebase_host: ${var.lakebase_host}
              lakebase_user: ${var.lakebase_user}
              lakebase_pass: ""
              uc_catalog: ${var.catalog}
              uc_schema: ${var.schema}
              n_rows: ${var.n_rows}
              model_name: ${var.model_name}
              n_decisions: "10000"
              target_p99_ms: "50"

        - task_key: 02_model_training
          depends_on:
            - task_key: 01_data_generation
          notebook_task:
            notebook_path: ../notebooks/02_model_training.py
            base_parameters: *pipeline_params

        - task_key: 03_feature_store
          depends_on:
            - task_key: 02_model_training
          notebook_task:
            notebook_path: ../notebooks/03_feature_store.py
            base_parameters: *pipeline_params

        - task_key: 04_realtime_serving
          depends_on:
            - task_key: 03_feature_store
          notebook_task:
            notebook_path: ../notebooks/04_realtime_serving.py
            base_parameters: *pipeline_params

        - task_key: 05_decision_log
          depends_on:
            - task_key: 04_realtime_serving
          notebook_task:
            notebook_path: ../notebooks/05_decision_log.py
            base_parameters: *pipeline_params
