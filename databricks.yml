bundle:
  name: lakebase-fsi-credit-decisioning

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog name where the solution will be deployed"
    default: ""

  schema:
    description: "UC Schema name (will be created if missing)"
    default: "lakebase_credit_demo"

  lakebase_host:
    description: "Lakebase endpoint host (ep-xxxxx.database.<region>.cloud.databricks.com)"
    default: ""

  lakebase_user:
    description: "Lakebase user (Databricks email or SP client_id)"
    default: ""

  n_rows:
    description: "Synthetic dataset size (rows) generated in notebook 01"
    default: "100000"

  model_name:
    description: "Registered champion model name (must match notebook 02)"
    default: "credit_scoring_v1"

targets:
  dev:
    default: true
    mode: development

  prod:
    mode: production
