command: ["python", "app.py"]

# ── Environment variables ──────────────────────────────────────────────────────
# Replace ALL <placeholder> values with your own before deploying.
# DATABRICKS_HOST is injected automatically by the Apps runtime — no need to set it.
env:
  # Lakebase PostgreSQL endpoint
  # Get this from: Catalog Explorer → Lakebase → your instance → Host
  - name: LAKEBASE_HOST
    value: "<your-lakebase-endpoint>.database.<region>.cloud.databricks.com"

  # Your Databricks email address (interactive users) or SP client_id (jobs)
  - name: LAKEBASE_USER
    value: "<your-email@company.com>"

  # Do not change these unless your workspace uses non-default values
  - name: LAKEBASE_DB
    value: "databricks_postgres"
  - name: LAKEBASE_PORT
    value: "5432"

  # Unity Catalog — must match the catalog used in notebooks 01-05
  - name: UC_CATALOG
    value: "<your-uc-catalog>"
  - name: UC_SCHEMA
    value: "lakebase_credit_demo"

  # MLflow model name — must match notebook 02
  - name: MODEL_NAME
    value: "credit_scoring_v1"

  # Must match the n_rows used when running notebook 01
  - name: N_ROWS
    value: "100000"

  # Lakebase endpoint path for credential exchange.
  # Get this from: Catalog Explorer → Lakebase → your instance → copy the endpoint path.
  # Format: projects/<project-name>/branches/<branch>/endpoints/primary
  - name: LAKEBASE_ENDPOINT_PATH
    value: "<your-lakebase-endpoint-path>"

# ── Auth note ──────────────────────────────────────────────────────────────────
# The App authenticates to Lakebase using two built-in mechanisms — no Secrets block needed:
#
#   1. Browser sessions: X-Forwarded-Access-Token (user's own OAuth token, injected by runtime)
#   2. Startup / background: SDK generate_database_credential using the App's built-in SP
#
# LAKEBASE_ENDPOINT_PATH above is the only Lakebase-specific value needed.
# The Databricks runtime injects DATABRICKS_HOST and the SP identity automatically.
